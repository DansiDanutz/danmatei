name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize JavaScript and TypeScript analysis
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.34.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze the reviewed source
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.34.1
        with:
          category: /language:javascript-typescript
